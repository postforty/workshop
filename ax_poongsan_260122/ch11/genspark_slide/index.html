<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두바이 쿠키 트렌드 분석 - 프레젠테이션</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f8f8f8;
        }

        .slide-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease-in-out;
            z-index: 1;
        }

        .slide-wrapper.active {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Navigation Controls */
        .controls {
            position: fixed;
            bottom: 30px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .nav-btn:hover {
            background: #fff;
            transform: translateY(-2px);
            border-color: rgb(87, 117, 144);
            color: rgb(87, 117, 144);
        }

        .nav-btn:active {
            transform: translateY(0);
        }

        .slide-counter {
            background: rgba(87, 117, 144, 0.9);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(87, 117, 144, 0.2);
        }

        .progress-line {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: rgb(87, 117, 144);
            z-index: 2000;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Click to Focus Hint */
        #focus-hint {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 3000;
        }
    </style>
</head>

<body>
    <div class="progress-line" id="progress"></div>
    <div id="focus-hint">키보드 제어를 위해 화면을 클릭해주세요.</div>

    <div id="slides-container">
        <div class="slide-wrapper active"><iframe src="01.html"></iframe></div>
        <div class="slide-wrapper"><iframe src="02.html"></iframe></div>
        <div class="slide-wrapper"><iframe src="03.html"></iframe></div>
        <div class="slide-wrapper"><iframe src="04.html"></iframe></div>
        <div class="slide-wrapper"><iframe src="05.html"></iframe></div>
    </div>

    <div class="controls">
        <div class="nav-btn" onclick="prevSlide()" title="이전 (←)">
            <i class="fas fa-chevron-left"></i>
        </div>
        <div class="slide-counter" id="counter">1 / 5</div>
        <div class="nav-btn" onclick="nextSlide()" title="다음 (→, Space)">
            <i class="fas fa-chevron-right"></i>
        </div>
    </div>

    <script>
        let currentIdx = 0;
        const slides = document.querySelectorAll('.slide-wrapper');
        const progress = document.getElementById('progress');
        const counter = document.getElementById('counter');

        function updateDisplay() {
            slides.forEach((slide, idx) => {
                if (idx === currentIdx) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });

            const percent = ((currentIdx + 1) / slides.length) * 100;
            progress.style.width = percent + "%";
            counter.innerText = `${currentIdx + 1} / ${slides.length}`;

            // Focus back to window for keyboard events
            window.focus();
        }

        function nextSlide() {
            if (currentIdx < slides.length - 1) {
                currentIdx++;
                updateDisplay();
            }
        }

        function prevSlide() {
            if (currentIdx > 0) {
                currentIdx--;
                updateDisplay();
            }
        }

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") {
                nextSlide();
            } else if (e.key === "ArrowLeft") {
                prevSlide();
            }
        });

        // Handle messages from iframes (Key Relay)
        window.addEventListener('message', (event) => {
            if (event.data.type === 'keydown') {
                const key = event.data.key;
                if (key === "ArrowRight" || key === " " || key === "Enter") nextSlide();
                else if (key === "ArrowLeft") prevSlide();
            }
        });

        // Initialize display
        updateDisplay();
    </script>
</body>

</html>
